    <!-- Imports Roboto weights (300 for light, 700/900 for bold) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Setup */
        body {
            background-color: #222222 !important; /* Force true dark grey background */
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center horizontally */
            justify-content: center; /* Center vertically */
            text-align: center;
        }

        /* Header Layout Wrapper */
        header {
            margin-bottom: 3rem;
        }

        /* Title Styling */
        h1 {
            font-size: 2.5rem;
            font-weight: 900; /* Extra bold */
            letter-spacing: -0.05em;
            margin: 0 0 0.5rem 0;
        }

        /* Subtitle Styling */
        .subtitle {
            font-size: 1.1rem;
            font-weight: 300; /* Light font weight */
            color: #b0b0b0; /* Lighter grey text */
            letter-spacing: 0.05em;
            margin: 0;
        }

        /* List Layout */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 1rem 0;
        }

        /* Link Styling */
        a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #ffffff; /* Bright white on hover */
        }
    </style>
</head>
